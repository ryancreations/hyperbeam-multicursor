<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperbeam Multi-Cursor</title>
  <style>
    body { margin:0; padding:0; background:#111; overflow:hidden; }
    #container { width:100vw; height:100vh; background:#000; }
    .cursor {
      position: absolute;
      font-size: 32px;
      pointer-events: none;
      z-index: 10000;
      text-shadow: 0 0 10px black;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script type="module">
    import Hyperbeam from "https://unpkg.com/@hyperbeam/web@latest/dist/index.js";

    const container = document.getElementById("container");

    // ←←← PASTE YOUR REAL EMBED URL HERE
    const embedUrl = "https://hyperbeam.com/app/room/kesm16zhQ-yFhYYRsBLxhA";

    async function main() {
      try {
        await Hyperbeam(container, embedUrl, {
          startUrl: "https://google.com",
          onCursor({ clientX, clientY, userId, color }) {
            let cursor = document.getElementById("c-" + userId);
            if (!cursor) {
              cursor = document.createElement("div");
              cursor.id = "c-" + userId;
              cursor.className = "cursor";
              cursor.textContent = "👆";
              document.body.appendChild(cursor);
            }
            cursor.style.left = clientX + "px";
            cursor.style.top = clientY + "px";
            if (color) cursor.style.color = color;
          }
        });
      } catch (err) {
        container.innerHTML = `<p style="color:red;padding:40px;">Error: ${err.message}</p>`;
      }
    }

    main();
  </script>
</body>
</html>
