<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperbeam Multi-Cursor</title>
  <style>
    body { margin:0; background:#111; color:white; font-family:sans-serif; }
    #container { width:100vw; height:100vh; background:black; }
    .cursor {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      z-index: 10000;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script type="module">
    import Hyperbeam from "https://unpkg.com/@hyperbeam/web@latest/dist/index.js";

    const container = document.getElementById("container");
    
    // ←←← CHANGE THIS LINE
    const embedUrl = "https://YOUR-EMBED-URL.hyperbeam.com/xxxxxxxxxxxx";

    async function start() {
      try {
        await Hyperbeam(container, embedUrl, {
          onCursor({ clientX, clientY, userId, color }) {
            let cursor = document.getElementById("c" + userId);
            if (!cursor) {
              cursor = document.createElement("div");
              cursor.id = "c" + userId;
              cursor.className = "cursor";
              cursor.textContent = "👆";
              document.body.appendChild(cursor);
            }
            cursor.style.left = clientX + "px";
            cursor.style.top = clientY + "px";
            if (color) cursor.style.color = color;
          }
        });
      } catch(e) {
        alert("Error: " + e.message);
      }
    }
    start();
  </script>
</body>
</html>
